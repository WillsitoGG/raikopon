name: WillsitoGG - Build Raikopon SD Path v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact official v2.5.0 NRO
        run: |
          set -euo pipefail
          mkdir -p willsito-build-output
          curl --fail --location --retry 3 -o willsito-build-output/raikopon-upstream.nro \
            https://github.com/Raibatsu/raikopon/releases/download/v2.5.0/raikopon.nro
          echo 'f790c1d81abf21af6d02cb5b350e254784349695688714a21846fff46eac4b33  willsito-build-output/raikopon-upstream.nro' | sha256sum -c -
      - name: Patch and validate
        run: |
          set -euo pipefail
          python3 Willsito_Tuning/patch-raikopon-sdpath-v3.py \
            willsito-build-output/raikopon-upstream.nro \
            willsito-build-output/raikopon.nro \
            willsito-build-output/validation.json
          echo '81ec7aa5b73f347f9cb80d7899445b0cde51d693164d81c5529e1b674ab83638  willsito-build-output/raikopon.nro' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: raikopon-v2.5.0-sdpath-v3
          path: |
            willsito-build-output/raikopon.nro
            willsito-build-output/validation.json
